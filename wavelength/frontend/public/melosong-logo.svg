<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer badge -->
  <rect width="120" height="120" rx="28" fill="#0d0d1a"/>
  <!-- Gradient glow layer -->
  <rect width="120" height="120" rx="28" fill="url(#glow)"/>
  <!-- Gradient border ring -->
  <rect x="1.5" y="1.5" width="117" height="117" rx="26.5" fill="none"
    stroke="url(#bg)" stroke-width="2.5" opacity="0.7"/>

  <!-- Subtle wave lines behind letters -->
  <line x1="10" y1="90" x2="22" y2="90" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.12"/>
  <line x1="10" y1="84" x2="22" y2="84" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.08"/>
  <line x1="98" y1="90" x2="110" y2="90" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.12"/>
  <line x1="98" y1="84" x2="110" y2="84" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.08"/>

  <!-- M letter - bold geometric -->
  <polyline
    points="14,82 14,38 38,70 62,38 62,82"
    stroke="url(#bg)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"
    fill="none" filter="url(#shadow)"/>
  <polyline
    points="14,82 14,38 38,70 62,38 62,82"
    stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"
    fill="none" opacity="0.95"/>

  <!-- S letter - flowing -->
  <path
    d="M 76 46 C 76 41 80 36 90 36 C 100 36 106 41 106 48 C 106 55 98 59 90 63 C 82 67 76 71 76 79 C 76 86 82 90 92 90 C 100 90 106 85 106 85"
    stroke="url(#bg)" stroke-width="7.5" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
  <path
    d="M 76 46 C 76 41 80 36 90 36 C 100 36 106 41 106 48 C 106 55 98 59 90 63 C 82 67 76 71 76 79 C 76 86 82 90 92 90 C 100 90 106 85 106 85"
    stroke="white" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.95"/>
</svg>
